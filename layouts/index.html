{{ define "main" }}
<article>
  {{ .Content }}

  {{ range .Site.Sections.ByWeight }}
  <section class="work">
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    {{ .Content }}
  </section>
  {{ end }}

  {{ with .Site.Params.elsewhere }}
  <footer class="elsewhere">
    {{ range . }}
    <a href="{{ .url }}">{{ .name }}</a>
    {{ end }}
  </footer>
  {{ end }}
</article>
{{ end }}
