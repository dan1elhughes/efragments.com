{{ define "main" }}
<article>
  <h1>Grid Works</h1>
  
  {{ with .Site.GetPage "section" "grid-works" }}
    {{ .Content }}
    <div class="gif-grid constrained">
      {{ $pages := .Pages }}
      {{ range sort $pages "File.Dir" "asc" }}
      <figure>
        <a href="{{ .RelPermalink }}">
          <!-- DEBUG OUTPUT -->
          <div style="display:none;">
            Debug: File.Dir = {{ .File.Dir }}
            Debug: After TrimSuffix = {{ strings.TrimSuffix "/" .File.Dir }}
            Debug: After TrimPrefix = {{ strings.TrimPrefix "grid-works/" (strings.TrimSuffix "/" .File.Dir) }}
            Debug: gifName would be = {{ printf "%s-%s.gif" (strings.TrimPrefix "grid-works/" (strings.TrimSuffix "/" .File.Dir)) (strings.TrimPrefix "grid-works/" (strings.TrimSuffix "/" .File.Dir)) }}
          </div>
          {{ $seriesNum := strings.TrimPrefix "grid-works/" (strings.TrimSuffix "/" .File.Dir) }}
          {{ $gifName := printf "%s-%s.gif" $seriesNum $seriesNum }}
          {{ $gif := .Resources.GetMatch $gifName }}
          {{ with $gif }}
            <img src="{{ .RelPermalink }}" alt="{{ .Name }}" />
          {{ end }}
        </a>
        <figcaption><a href="{{ .RelPermalink }}">{{ .Title }}</a></figcaption>
      </figure>
      {{ end }}
    </div>
  {{ end }}

  <h1>Stories</h1>
  {{ range .Site.RegularPages }}
  <div>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <hr />
  </div>
  {{ end }}
</article>
{{ end }}
